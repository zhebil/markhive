<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markhive</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header>
      <span class="logo">Markhive</span>
      <span id="chat-title" class="chat-title" title=""></span>
    </header>

    <div class="options">
      <label class="option-row">
        <input type="checkbox" id="opt-frontmatter">
        <span>Include frontmatter</span>
      </label>
      <label class="option-row">
        <input type="checkbox" id="opt-thinking">
        <span>Include thinking</span>
      </label>
      <label class="option-row">
        <input type="checkbox" id="opt-tool-inputs">
        <span>Include tool inputs</span>
      </label>
      <label class="option-row">
        <input type="checkbox" id="opt-tool-results">
        <span>Include tool results</span>
      </label>

      <label class="option-row option-row-text">
        <span class="option-label">Download subfolder</span>
        <input type="text" id="opt-subfolder" placeholder="e.g. claude-exports" autocomplete="off" spellcheck="false">
      </label>
    </div>

    <div class="actions">
      <button id="btn-generate">Generate</button>
    </div>

    <div id="preview-region" class="preview-region hidden">
      <div class="preview-meta">
        <span id="preview-source" class="preview-source"></span>
        <button id="btn-regenerate" class="btn-icon" title="Regenerate (re-read conversation)" aria-label="Regenerate">↻</button>
      </div>
      <textarea id="preview-textarea" spellcheck="false" aria-label="Rendered markdown"></textarea>
      <div class="preview-actions">
        <button id="btn-copy">Copy</button>
        <button id="btn-download">Download</button>
      </div>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
